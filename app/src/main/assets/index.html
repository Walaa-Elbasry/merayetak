<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرايتك</title>
<style>:root{color-scheme:light dark}*{-webkit-tap-highlight-color:transparent}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one centered column (max 560px) swapping three screens: who are you, 15 questions, hero card. Each personality has an element, an animal and a color. */
:root{
  --bg:#EEF3FA; --surface:#FFFFFF; --ink:#1B2140; --muted:#5D6685; --line:#D6DDEB;
  --fire:#F2582A; --water:#1597D6; --air:#1BA56A; --earth:#D08C00;
  --accent:#5B4BDB; --accent-soft:rgba(91,75,219,.12);
  --display:"Lalezar","Noto Kufi Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --body:"Baloo Bhaijaan 2","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121831; --surface:#1C2443; --ink:#F1F4FF; --muted:#A3ABCB; --line:#2E3860;
  --fire:#FF7A4D; --water:#45B6EC; --air:#3CCB8A; --earth:#F0AE2E; --accent:#8D80FF; --accent-soft:rgba(141,128,255,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121831; --surface:#1C2443; --ink:#F1F4FF; --muted:#A3ABCB; --line:#2E3860;
  --fire:#FF7A4D; --water:#45B6EC; --air:#3CCB8A; --earth:#F0AE2E; --accent:#8D80FF; --accent-soft:rgba(141,128,255,.16); color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6}
.app{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:18px 48px;display:flex;flex-direction:column;gap:20px}
.app[data-el=fire]{--accent:var(--fire);--accent-soft:color-mix(in srgb,var(--fire) 14%,transparent)}
.app[data-el=water]{--accent:var(--water);--accent-soft:color-mix(in srgb,var(--water) 14%,transparent)}
.app[data-el=air]{--accent:var(--air);--accent-soft:color-mix(in srgb,var(--air) 14%,transparent)}
.app[data-el=earth]{--accent:var(--earth);--accent-soft:color-mix(in srgb,var(--earth) 16%,transparent)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.em{font-family:var(--emoji);font-style:normal;line-height:1}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-family:var(--display);font-weight:400;font-size:24px}
.animals{display:flex;gap:4px;font-size:22px}
.screen{display:flex;flex-direction:column;gap:20px}
/* intro */
.intro h1{font-size:clamp(36px,10vw,54px)}
.intro h1 span{color:var(--accent)}
.lede{color:var(--muted);max-width:42ch}
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mate{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);min-width:0;border:2px solid transparent}
.mate .em{font-size:34px;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.mate strong{display:block;font-size:16px;line-height:1.3}
.mate small{color:var(--muted);font-size:13px;line-height:1.3;display:block}
.m-fire .em{background:color-mix(in srgb,var(--fire) 16%,transparent)} .m-water .em{background:color-mix(in srgb,var(--water) 16%,transparent)}
.m-air .em{background:color-mix(in srgb,var(--air) 16%,transparent)} .m-earth .em{background:color-mix(in srgb,var(--earth) 18%,transparent)}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface);padding:16px;border-radius:20px}
label{font-weight:700;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text]{font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.photo-pick{display:flex;align-items:center;gap:14px;padding:12px;border:2px dashed var(--line);border-radius:16px;cursor:pointer}
.photo-pick:focus-within{border-color:var(--accent)}
.avatar{width:66px;height:66px;border-radius:50%;flex:none;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-size:30px;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.photo-pick small{display:block;color:var(--muted);font-size:14px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:16px;padding:13px 18px;cursor:pointer;background:var(--accent);color:#fff;min-height:56px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.back{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;font-size:15px}
.back:disabled{visibility:hidden}
.count{margin-inline-start:auto;font-weight:700;font-variant-numeric:tabular-nums}
.track{position:relative;height:14px;border-radius:7px;background:var(--surface);overflow:hidden}
.track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);border-radius:7px;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.cheer{align-self:flex-start;background:var(--accent-soft);color:var(--ink);font-weight:700;padding:6px 14px;border-radius:999px;font-size:15px}
.q{font-size:clamp(28px,7.6vw,38px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:18px;text-align:start;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s,border-color .12s}
.opt .em{flex:none;font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.03)}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
/* thinking */
.thinking{align-items:center;text-align:center;padding-block:60px}
.spin{display:flex;gap:10px;font-size:44px}
.spin span{animation:hop .9s ease-in-out infinite}
.spin span:nth-child(2){animation-delay:.12s}.spin span:nth-child(3){animation-delay:.24s}.spin span:nth-child(4){animation-delay:.36s}
@keyframes hop{50%{transform:translateY(-16px)}}
/* result */
.hero{position:relative;background:var(--accent);color:#fff;border-radius:26px;padding:22px 18px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::before{width:220px;height:220px;top:-90px;inset-inline-end:-70px}
.hero::after{width:140px;height:140px;bottom:-60px;inset-inline-start:-40px}
.hero > *{position:relative}
.cardlabel{font-size:14px;letter-spacing:.08em;opacity:.9;font-weight:700}
.pic{position:relative;width:132px;height:132px}
.pic .avatar{width:132px;height:132px;font-size:58px;background:rgba(255,255,255,.2);color:#fff;box-shadow:0 0 0 5px #fff}
.badge{position:absolute;bottom:-6px;inset-inline-start:-10px;width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.hero .nm{font-size:20px;font-weight:700;margin-top:6px}
.hero h2{font-size:clamp(36px,10vw,50px)}
.hero .tag{font-size:18px;max-width:30ch;opacity:.95}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:22px;display:flex;align-items:center;gap:8px}
.card h3 .em{font-size:24px}
.stats{display:flex;flex-direction:column;gap:12px}
.stat{display:grid;grid-template-columns:96px 1fr 46px;gap:10px;align-items:center;font-weight:500}
.stat .bar{height:16px;border-radius:8px;background:var(--bg);overflow:hidden}
.stat .fill{height:100%;border-radius:8px;width:0;transition:width 1s cubic-bezier(.3,1.2,.5,1)}
.stat .v{font-variant-numeric:tabular-nums;text-align:end;font-weight:700}
.power{background:var(--accent-soft);border:2px solid var(--accent)}
.power p{font-size:19px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:4px 14px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:540px){.grid2{grid-template-columns:1fr 1fr}}
ul.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.list li{display:flex;gap:8px}
ul.list li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:9px}
ul.list.soft li::before{background:var(--line)}
.mate-card{display:flex;align-items:center;gap:14px}
.mate-card .em{font-size:44px}
.challenge{border:2px dashed var(--accent)}
.accept{align-self:flex-start;font:inherit;font-weight:700;border:2px solid var(--accent);background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.accept[aria-pressed=true]{background:var(--accent);color:#fff}
.motto{text-align:center;padding-block:8px}
.motto p{font-family:var(--display);font-size:clamp(30px,8vw,40px);color:var(--accent)}
.motto small{color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:12px}
.report-box{display:flex;flex-direction:column;gap:10px;align-items:center}
.report-box img{width:100%;max-width:360px;border-radius:16px}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;text-align:center;font-weight:700;z-index:5}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:4;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <div class="brand"><b>مرايتك</b><span class="animals em" id="brandAnimals"></span></div>

  <section class="screen intro" id="s-intro">
    <h1>إنت مين من <span>الأبطال الأربعة</span>؟</h1>
    <p class="lede">١٥ سؤال سريع. جاوب بأول حاجة تيجي في بالك، مفيش إجابة صح وغلط. في الآخر هيطلعلك كارت البطل بتاعك بصورتك واسمك.</p>
    <div class="team" id="team"></div>
    <form class="form" id="whoForm" novalidate>
      <div class="field">
        <label for="nameIn">اسمك إيه؟</label>
        <input type="text" id="nameIn" autocomplete="given-name" maxlength="24" placeholder="اكتب اسمك هنا">
      </div>
      <label class="photo-pick" for="photoIn">
        <span class="avatar" id="avPrev">؟</span>
        <span><strong>حط صورتك</strong><small id="photoNote">هتظهر على كارت البطل بتاعك (اختياري)</small></span>
        <input type="file" id="photoIn" class="sr" accept="image/*">
      </label>
      <button class="btn" id="startBtn" type="submit" disabled>يلا نبدأ!</button>
      <p class="hint">الصورة بتفضل على جهازك ومش بتتبعت لأي حد.</p>
    </form>
  </section>

  <section class="screen" id="s-quiz" hidden>
    <div class="qtop">
      <button class="back" id="backBtn" type="button">→ رجوع</button>
      <span class="count" id="count"></span>
    </div>
    <div class="track"><i id="prog"></i></div>
    <span class="cheer" id="cheer" hidden></span>
    <div class="fade" id="qWrap"><h2 class="q" id="qText"></h2></div>
    <div class="opts" id="opts"></div>
  </section>

  <section class="screen thinking" id="s-think" hidden>
    <div class="spin em"><span>🦁</span><span>🐬</span><span>🦎</span><span>🦉</span></div>
    <h2>بنحلل إجاباتك…</h2>
    <p class="hint">ثواني ونطلعلك البطل اللي جواك</p>
  </section>

  <section class="screen" id="s-result" hidden></section>
</div>
<canvas id="confetti" hidden></canvas>
<div class="toast" id="toast" hidden></div>

/* scoring */
function score(){
  const c={fire:0,water:0,air:0,earth:0},last={};
  S.answers.forEach((a,i)=>{c[a]++;last[a]=i});
  const rank=ORDER.slice().sort((a,b)=>c[b]-c[a]||(last[b]??-1)-(last[a]??-1));
  const pct={};let sum=0;ORDER.forEach(e=>{pct[e]=Math.round(c[e]/S.answers.length*100);sum+=pct[e]});
  pct[rank[0]]+=100-sum;
  return {rank,pct,main:rank[0],second:rank[1]};
}
function mixLine(r){
  const a=T[r.main],b=T[r.second];
  if(r.pct[r.main]>=60)return `إنت ${a.beast} أصلي ١٠٠٪! وال${a.stat} هي سلاحك الأول.`;
  if(r.pct[r.second]>=27)return `إنت ${a.beast} بس جواك ${b.beast} كمان! عندك ${a.stat} و${b.stat} مع بعض، ودي تركيبة نادرة.`;
  return `أساسك ${a.beast}، ومعاك لمسة ${b.stat} من ${b.beast}.`;
}

/* confetti */
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('confetti'),x=c.getContext('2d');c.hidden=false;
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,k=devicePixelRatio;
  const cols=['#F2582A','#1597D6','#1BA56A','#D08C00','#8D80FF','#FF4F9A'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*18*k,vy:(-Math.random()*16-6)*k,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,s:(6+Math.random()*7)*k,c:''}));
  ps.forEach((p,i)=>p.c=cols[i%6]);
  let t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);let alive=false;
    ps.forEach(p=>{p.vy+=.45*k;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<H+20)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(alive&&t-t0<4000)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0);
}

function lines(x,text,maxW){const out=[];let line='';for(const w of text.split(' ')){const s=line?line+' '+w:w;if(x.measureText(s).width>maxW&&line){out.push(line);line=w}else line=s}out.push(line);return out}

function wrap(x,text,px,py,maxW,lh,align){x.textAlign=align;const ls=lines(x,text,maxW);ls.forEach((l,i)=>x.fillText(l,px,py+i*lh));return py+ls.length*lh}
function chipRow(x,items,right,y,maxW,bg,fg,B){
  x.font=`bold 32px ${B}`;let cx=right;const h=62,gap=16;
  items.forEach(s=>{const w=x.measureText(s).width+60;if(right-cx+w>maxW){cx=right;y+=h+gap}
    rr(x,cx-w,y,w,h,31,bg);x.textAlign='center';x.fillStyle=fg;x.fillText(s,cx-w/2,y+43);cx-=w+gap});
  return y+h}
function fit(x,s,max){while(x.measureText(s).width>max&&s.length>1)s=s.slice(0,-1);return s}
function rp(x,a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else{r=Math.min(r,h/2,w/2);x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}}
function rr(x,a,b,w,h,r,f){rp(x,a,b,w,h,r);x.fillStyle=f;x.fill()}
function rrs(x,a,b,w,h,r){rp(x,a,b,w,h,r);x.stroke()}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src})}

window.claude?.hot?.snapshot?.(()=>({name:S.name,i:S.i,answers:S.answers,orders:S.orders,screen:S.screen==='think'?'result':S.screen}));
function start(d){if(d&&d.name&&d.orders&&d.orders.length===Q.length){Object.assign(S,d);nameIn.value=S.name;refreshStart();go(S.screen)}}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
