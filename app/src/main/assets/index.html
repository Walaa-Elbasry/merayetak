<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرايتك</title>
<style>:root{color-scheme:light dark}*{-webkit-tap-highlight-color:transparent}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one centered column (max 560px) that swaps between three screens: who are you, questions, report. Four classical elements carry the color. */
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --ink:#1A2120; --muted:#5B6661; --line:#D2D7D1;
  --fire:#CF4419; --water:#1B7398; --air:#7451BD; --earth:#62731F;
  --accent:var(--ink);
  --display:"Lalezar","Noto Kufi Arabic","Noto Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#1A1F1D; --ink:#E8EDE9; --muted:#97A29C; --line:#2C3431;
  --fire:#F06A40; --water:#4EAED3; --air:#A88AEC; --earth:#A9BD5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#1A1F1D; --ink:#E8EDE9; --muted:#97A29C; --line:#2C3431;
  --fire:#F06A40; --water:#4EAED3; --air:#A88AEC; --earth:#A9BD5C; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.65}
.app{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
.app[data-el=fire]{--accent:var(--fire)} .app[data-el=water]{--accent:var(--water)}
.app[data-el=air]{--accent:var(--air)} .app[data-el=earth]{--accent:var(--earth)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;letter-spacing:.02em}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.glyphs{display:flex;gap:6px}
.g{width:22px;height:22px;display:block}
.g path{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.g-fire path{stroke:var(--fire)} .g-water path{stroke:var(--water)} .g-air path{stroke:var(--air)} .g-earth path{stroke:var(--earth)}
.screen{display:flex;flex-direction:column;gap:22px}
.intro h1{font-size:clamp(40px,11vw,60px)}
.intro .lede{color:var(--muted);max-width:42ch}
.elements{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.el{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.el .g{width:30px;height:30px;flex:none}
.el span{font-size:14px;color:var(--muted);line-height:1.35}
.el strong{display:block;color:var(--ink);font-size:15px}
.form{display:flex;flex-direction:column;gap:14px}
label{font-weight:500;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
input[type=text]:focus{outline:none;border-color:var(--ink)}
.photo-pick{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.photo-pick:focus-within{border-color:var(--ink)}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-size:28px;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.photo-pick small{display:block;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--ink);color:var(--bg);min-height:52px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--accent);color:#fff}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.back{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;font-size:14px}
.back:disabled{visibility:hidden}
.count{margin-inline-start:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .35s ease}
.q{font-size:clamp(28px,7.4vw,38px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:start;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--muted)}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt.sel{border-color:var(--ink)} .opt.sel .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
/* result */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:8px}
.hero .avatar{width:120px;height:120px;font-size:52px;box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent)}
.hero .who{font-size:15px;color:var(--muted)}
.hero h2{font-size:clamp(34px,9vw,46px);color:var(--accent);display:flex;align-items:center;gap:10px}
.hero h2 .g{width:34px;height:34px}
.hero .tag{font-size:18px;max-width:32ch}
.mix{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:20px}
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:76px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.meter .track{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.meter .fill{height:100%;border-radius:5px}
.meter .v{font-variant-numeric:tabular-nums;text-align:end;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);font-weight:500;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:540px){.grid2{grid-template-columns:1fr 1fr}}
ul.list{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.advice{border:0;background:var(--accent);color:#fff}
.advice p{font-size:19px;font-weight:500}
.advice h3{opacity:.85;font-size:16px}
.actions{display:flex;flex-direction:column;gap:10px}
.report-box{display:flex;flex-direction:column;gap:10px;align-items:center}
.report-box img{width:100%;max-width:360px;border-radius:12px;border:1px solid var(--line)}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;text-align:center;font-weight:500;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <div class="brand"><b>مرايتك</b><span class="glyphs" id="brandGlyphs"></span></div>

  <section class="screen intro" id="s-intro">
    <h1>اعرف نفسك في ١٠ أسئلة</h1>
    <p class="lede">جاوب بأول حاجة تيجي في بالك. كل إجابة بتقرّبك من عنصر من العناصر الأربعة، وفي الآخر هيطلعلك تقرير تحليلي بصورتك واسمك.</p>
    <div class="elements" id="elList"></div>
    <form class="form" id="whoForm" novalidate>
      <div class="field">
        <label for="nameIn">اسمك</label>
        <input type="text" id="nameIn" autocomplete="given-name" maxlength="30" placeholder="مثلاً: سارة">
      </div>
      <label class="photo-pick" for="photoIn">
        <span class="avatar" id="avPrev">؟</span>
        <span><strong>صورتك الشخصية</strong><small id="photoNote">اضغط واختار صورة، هتظهر في التقرير</small></span>
        <input type="file" id="photoIn" class="sr" accept="image/*">
      </label>
      <button class="btn" id="startBtn" type="submit" disabled>ابدأ الاختبار</button>
      <p class="hint">الصورة بتفضل على جهازك، مش بتتبعت لأي مكان.</p>
    </form>
  </section>

  <section class="screen" id="s-quiz" hidden>
    <div class="qtop">
      <button class="back" id="backBtn" type="button">→ السؤال اللي فات</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="fade" id="qWrap">
      <h2 class="q" id="qText"></h2>
    </div>
    <div class="opts" id="opts"></div>
  </section>

  <section class="screen" id="s-result" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
document.documentElement.dir='rtl';document.documentElement.lang='ar';
const GLYPH={fire:'M12 3 L21.5 20 L2.5 20 Z',water:'M12 21 L21.5 4 L2.5 4 Z',
 air:'M12 3 L21.5 20 L2.5 20 Z M6.2 13.4 L17.8 13.4',earth:'M12 21 L21.5 4 L2.5 4 Z M6.2 10.6 L17.8 10.6'};
const svg=(el,cls='')=>`<svg class="g g-${el} ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${GLYPH[el]}"/></svg>`;
const ORDER=['fire','water','air','earth'];
const T={
 fire:{name:'النار',title:'القائد الجريء',tag:'بتاخد القرار وتمشي، والناس بتمشي وراك.',
  traits:['حاسم','جريء','صريح','بيحب التحدي'],
  strong:['بتتحرك بسرعة وقت الأزمات','بتشجّع اللي حواليك وتشدّهم لقدّام','مش بتهرب من المسؤولية'],
  watch:['ساعات بتستعجل في الحكم على الناس','صراحتك ممكن تجرح من غير ما تقصد','الصبر مش أقوى حاجة عندك'],
  work:'مكانك الطبيعي في القيادة وإدارة المشاريع اللي فيها ضغط ونتايج واضحة.',
  love:'بتحب بوضوح وبتحمي اللي بتحبهم. اسمع أكتر ما تتكلم وهتكسب قلوب أكتر.',
  match:'water',matchWhy:'بيهدّيك ويفكّرك إن الناس أهم من السرعة.',
  advice:'مش كل معركة لازم تكسبها. اختار معاركك.'},
 water:{name:'الميّة',title:'الحنون المتعاطف',tag:'بتحس بالناس قبل ما يتكلموا.',
  traits:['متعاطف','وفي','مستمع كويس','هادي'],
  strong:['بتفهم مشاعر اللي قدامك بسرعة','بتعرف تصالح وتجمع الناس','وفي جدًا ومش بتتخلى عن حد'],
  watch:['بتشيل همّ غيرك أكتر من همّك','صعب عليك تقول لأ','الكلام بيأثر فيك أكتر من اللازم'],
  work:'بتلمع في أي مكان فيه ناس: تعليم، دعم، موارد بشرية، علاج، خدمة عملاء.',
  love:'بتدّي كتير ومن قلبك. اتأكد إن اللي قدامك بيدّي زيك.',
  match:'earth',matchWhy:'بيديك أمان وثبات وبيشيل معاك.',
  advice:'قول لأ من غير ما تحس بالذنب. راحتك مش أنانية.'},
 air:{name:'الهوا',title:'المبدع الحالم',tag:'دماغك دايمًا شغالة بفكرة جديدة.',
  traits:['خيالي','فضولي','حر','بيحب التغيير'],
  strong:['بتشوف حلول محدش شافها','بتكسر الملل في أي مكان تدخله','بتتعلم الجديد بسرعة'],
  watch:['بتبدأ حاجات كتير ومش بتكمّلها','الروتين بيخنقك','ساعات بتسرح في عز الكلام'],
  work:'مكانك في التصميم، المحتوى، التسويق، أو أي شغل فيه حرية وأفكار جديدة.',
  love:'محتاج حد يسيبلك مساحتك ويشاركك مغامراتك.',
  match:'fire',matchWhy:'بيحوّل أفكارك لحاجة حقيقية على الأرض.',
  advice:'الفكرة الحلوة محتاجة خطة. كمّل حاجة واحدة للآخر.'},
 earth:{name:'الأرض',title:'المنظّم العاقل',tag:'بتفكر قبل ما تتحرك، وكلامك موزون.',
  traits:['منظّم','عملي','صبور','يُعتمد عليه'],
  strong:['بتخطط وبتنفّذ صح','الناس بتثق فيك من غير تفكير','هادي وقت الضغط'],
  watch:['المفاجآت بتقلقك','ساعات بتفكر زيادة عن اللزوم','صعب تجرّب حاجة جديدة'],
  work:'بتنجح في الإدارة، الحسابات، الهندسة، وأي شغل محتاج دقة ونفَس طويل.',
  love:'بتحب بالأفعال مش بالكلام، وثباتك أمان للي حواليك.',
  match:'air',matchWhy:'بيضيف لحياتك ألوان وتجديد.',
  advice:'سيب مساحة للمفاجأة. مش كل حاجة لازم تتحسب.'}
};
const Q=[
 ['جالك يوم إجازة فجأة، هتعمل إيه؟',{fire:'أخطط لخروجة وألمّ الشلة',water:'أكلّم حد وحشني وأقعد معاه',air:'أروح مكان أول مرة أشوفه',earth:'أخلّص الحاجات المتأجلة وأرتّب أوضتي'}],
 ['شغل جماعي والفريق تايه، دورك إيه؟',{fire:'أمسك الدفة وأوزّع المهام',water:'أطمّن الناس وأخليهم مرتاحين',air:'أطلع بفكرة مختلفة تقلب الموضوع',earth:'أعمل جدول وخطة خطوة بخطوة'}],
 ['صاحبك زعلان ومش عايز يتكلم:',{fire:'أقوله "قوم معايا" وأخرّجه من الجو ده',water:'أقعد جنبه وأستنى لحد ما يفتح قلبه',air:'أبعتله حاجة تضحّكه',earth:'أسأله بهدوء إيه المشكلة ونفكر في حل'}],
 ['لو هتختار مكان تعيش فيه:',{fire:'وسط البلد، دوشة وحركة طول اليوم',water:'بيت عيلة كبير قريب من حبايبي',air:'شقة صغيرة فوق السطح بمنظر حلو',earth:'مكان هادي ومنظّم وكل حاجة قريبة'}],
 ['حد انتقدك قدام الناس:',{fire:'أرد عليه في ساعتها',water:'أسكت بس الكلام يفضل في بالي',air:'أضحك وأعدّيها بنكتة',earth:'أسمع كويس وأقرر بعدين إذا كان عنده حق'}],
 ['مشروبك المفضل:',{fire:'قهوة سادة تقيلة',water:'شاي بلبن في البيت مع العيلة',air:'حاجة جديدة من المنيو أول مرة أجربها',earth:'نفس المشروب كل مرة، المضمون مضمون'}],
 ['قدامك قرار كبير:',{fire:'أمشي ورا إحساسي وأقرر بسرعة',water:'أفكر هيأثر على اللي حواليا إزاي',air:'أتخيل كل الاحتمالات المجنونة الأول',earth:'أكتب المميزات والعيوب وأقارن'}],
 ['في السفر، إنت الشخص اللي:',{fire:'بيحدد البرنامج ويصحّي الكل بدري',water:'بيتأكد إن الكل مبسوط وواكل',air:'بيتوه عشان شاف شارع شكله حلو',earth:'معاه شاحن وأدوية ونسخة من كل الورق'}],
 ['إيه أكتر حاجة بتضايقك؟',{fire:'البطء والتردد',water:'إن حد يكون قاسي على حد',air:'الروتين والتكرار',earth:'الفوضى وعدم الالتزام بالمواعيد'}],
 ['الناس بتوصفك إزاي؟',{fire:'"جدع وبيعرف ياخد قرار"',water:'"قلبه أبيض وبيسمع"',air:'"دماغه حلوة ومختلف"',earth:'"عاقل ويُعتمد عليه"'}]
];
const ar=n=>Number(n).toLocaleString('ar-EG');
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let S={screen:'intro',name:'',photo:null,i:0,answers:[],orders:Q.map(()=>shuffle(ORDER))};

/* intro */
$('brandGlyphs').innerHTML=ORDER.map(e=>svg(e)).join('');
$('elList').innerHTML=ORDER.map(e=>`<div class="el">${svg(e)}<span><strong>${T[e].name}</strong>${T[e].title}</span></div>`).join('');
const nameIn=$('nameIn'),startBtn=$('startBtn');
function refreshStart(){S.name=nameIn.value.trim();startBtn.disabled=!S.name;
  if(!S.photo)$('avPrev').textContent=S.name?S.name[0]:'؟'}
nameIn.addEventListener('input',refreshStart);
$('photoIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
      const c=document.createElement('canvas'),s=Math.min(img.width,img.height),o=480;
      c.width=c.height=o;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,o,o);
      S.photo=c.toDataURL('image/jpeg',.88);
      $('avPrev').innerHTML=`<img src="${S.photo}" alt="">`;$('photoNote').textContent='تمام، اضغط تاني لو عايز تغيّرها';};
    img.src=r.result};
  r.readAsDataURL(f)});
$('whoForm').addEventListener('submit',e=>{e.preventDefault();if(!nameIn.value.trim())return;refreshStart();S.i=0;S.answers=[];S.orders=Q.map(()=>shuffle(ORDER));go('quiz')});

function go(screen){S.screen=screen;
  ['intro','quiz','result'].forEach(s=>$('s-'+s).hidden=s!==screen);
  if(screen==='quiz')renderQ();
  if(screen==='result')renderResult();
  if(screen==='intro'){$('app').removeAttribute('data-el')}
  window.scrollTo(0,0)}

/* quiz */
const LET=['أ','ب','ج','د'];
function renderQ(){
  const [text,opts]=Q[S.i];
  $('count').textContent=`سؤال ${ar(S.i+1)} من ${ar(Q.length)}`;
  $('prog').style.width=(S.i/Q.length*100)+'%';
  $('backBtn').disabled=S.i===0;
  const w=$('qWrap');w.classList.remove('fade');void w.offsetWidth;w.classList.add('fade');
  $('qText').textContent=text;
  $('opts').innerHTML=S.orders[S.i].map((el,k)=>`<button class="opt fade${S.answers[S.i]===el?' sel':''}" type="button" data-el="${el}"><span class="k">${LET[k]}</span><span>${opts[el]}</span></button>`).join('');
}
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  S.answers[S.i]=b.dataset.el;b.classList.add('sel');
  setTimeout(()=>{if(S.i<Q.length-1){S.i++;renderQ()}else{$('prog').style.width='100%';go('result')}},220)});
$('backBtn').addEventListener('click',()=>{if(S.i>0){S.i--;renderQ()}});

/* scoring */
function score(){
  const c={fire:0,water:0,air:0,earth:0},last={};
  S.answers.forEach((a,i)=>{c[a]++;last[a]=i});
  const rank=ORDER.slice().sort((a,b)=>c[b]-c[a]||(last[b]??-1)-(last[a]??-1));
  const pct={};ORDER.forEach(e=>pct[e]=Math.round(c[e]/S.answers.length*100));
  return {rank,pct,main:rank[0],second:rank[1]};
}
function mixLine(r){
  const p=r.pct[r.main];
  if(p>=70)return `${T[r.main].name} مسيطرة عليك بشكل واضح.`;
  if(r.pct[r.second]>=30)return `عندك مزيج قوي: ${T[r.main].name} ومعاها ${T[r.second].name} بنسبة ${ar(r.pct[r.second])}٪، يعني ${T[r.second].traits[0]} كمان.`;
  return `أساسك ${T[r.main].name}، وفيك لمسة من ${T[r.second].name}.`;
}
const avatarHTML=()=>S.photo?`<img src="${S.photo}" alt="صورة ${S.name}">`:S.name[0];

function renderResult(){
  const r=score(),t=T[r.main],m=T[t.match];
  $('app').dataset.el=r.main;
  $('s-result').innerHTML=`
  <div class="hero">
    <div class="avatar">${avatarHTML()}</div>
    <p class="who">تحليل شخصية ${esc(S.name)}</p>
    <h2>${svg(r.main)}${t.title}</h2>
    <p class="tag">${t.tag}</p>
    <p class="mix">${mixLine(r)}</p>
  </div>
  <div class="card"><h3>العناصر جواك</h3><div class="meters">${r.rank.map(e=>`
    <div class="meter"><span>${T[e].name}</span><div class="track"><div class="fill" style="width:${r.pct[e]}%;background:var(--${e})"></div></div><span class="v">${ar(r.pct[e])}٪</span></div>`).join('')}</div></div>
  <div class="card"><h3>صفاتك</h3><div class="chips">${t.traits.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
  <div class="grid2">
    <div class="card"><h3>نقط قوتك</h3><ul class="list">${t.strong.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="card"><h3>خد بالك من</h3><ul class="list">${t.watch.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="card"><h3>في الشغل</h3><p>${t.work}</p></div>
    <div class="card"><h3>في العلاقات</h3><p>${t.love}</p></div>
  </div>
  <div class="card"><h3>أكتر حد بيكمّلك</h3><p><strong style="color:var(--${t.match})">${m.title} (${m.name})</strong>، ${t.matchWhy}</p></div>
  <div class="card advice"><h3>نصيحتك</h3><p>${t.advice}</p></div>
  <div class="actions">
    <button class="btn acc" id="dlBtn" type="button">حمّل التقرير كصورة</button>
    <div class="report-box" id="reportBox" hidden></div>
    <button class="btn alt" id="againBtn" type="button">العب تاني</button>
  </div>`;
  $('dlBtn').onclick=()=>makeReport(r);
  $('againBtn').onclick=()=>go('intro');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2800)}

/* report image: 1080x1920 */
const RC={fire:'#F06A40',water:'#4EAED3',air:'#A88AEC',earth:'#A9BD5C'};
async function makeReport(r){
  const btn=$('dlBtn');btn.disabled=true;btn.textContent='بنجهّز التقرير…';
  try{await document.fonts.ready}catch(e){}
  const W=1080,H=2400,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),t=T[r.main],acc=RC[r.main];
  const D=getComputedStyle(document.documentElement).getPropertyValue('--display').trim()||'sans-serif';
  const B=getComputedStyle(document.documentElement).getPropertyValue('--body').trim()||'sans-serif';
  x.direction='rtl';
  x.fillStyle='#111514';x.fillRect(0,0,W,H);
  // big faint glyph
  x.save();x.globalAlpha=.07;x.strokeStyle=acc;x.lineWidth=40;x.lineJoin='round';
  x.translate(W/2-560,140);x.scale(46.6,46.6);x.lineWidth=40/46.6;x.stroke(new Path2D(GLYPH[r.main]));x.restore();
  x.fillStyle=acc;x.fillRect(0,0,W,14);
  const R=W-90,L=90;
  x.textAlign='right';x.fillStyle='#E8EDE9';x.font=`44px ${D}`;x.fillText('مرايتك',R,110);
  x.textAlign='left';x.fillStyle='#97A29C';x.font=`28px ${B}`;
  x.fillText(new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'}),L,106);
  // photo
  const cy=290,rad=130;
  x.beginPath();x.arc(W/2,cy,rad+16,0,Math.PI*2);x.fillStyle=acc;x.fill();
  x.beginPath();x.arc(W/2,cy,rad+6,0,Math.PI*2);x.fillStyle='#111514';x.fill();
  x.save();x.beginPath();x.arc(W/2,cy,rad,0,Math.PI*2);x.clip();
  if(S.photo){const im=await loadImg(S.photo);x.drawImage(im,W/2-rad,cy-rad,rad*2,rad*2)}
  else{x.fillStyle='#1A1F1D';x.fillRect(W/2-rad,cy-rad,rad*2,rad*2);x.fillStyle=acc;x.font=`150px ${D}`;x.textAlign='center';x.textBaseline='middle';x.fillText(S.name[0],W/2,cy+10);x.textBaseline='alphabetic'}
  x.restore();
  x.textAlign='center';x.fillStyle='#97A29C';x.font=`32px ${B}`;x.fillText('تحليل شخصية',W/2,490);
  x.fillStyle='#E8EDE9';x.font=`bold 64px ${B}`;x.fillText(fit(x,S.name,880),W/2,565);
  x.fillStyle=acc;x.font=`104px ${D}`;x.fillText(t.title,W/2,690);
  x.fillStyle='#E8EDE9';x.font=`40px ${B}`;let ty=wrap(x,t.tag,W/2,755,900,52,'center');
  x.fillStyle='#97A29C';x.font=`30px ${B}`;x.fillText('عنصرك: '+t.name,W/2,ty+8);
  // meters
  let y=ty+90;
  r.rank.forEach(e=>{
    x.textAlign='right';x.fillStyle='#E8EDE9';x.font=`500 32px ${B}`;x.fillText(T[e].name,R,y+12);
    const bx=L+110,bw=R-160-bx;
    rr(x,bx,y-12,bw,24,12,'#232A27');
    if(r.pct[e]>0)rr(x,bx+bw*(1-r.pct[e]/100),y-12,bw*r.pct[e]/100,24,12,RC[e]);
    x.textAlign='left';x.fillStyle='#97A29C';x.font=`30px ${B}`;x.fillText(ar(r.pct[e])+'٪',L,y+12);
    y+=62});
  // traits chips
  y+=20;x.font=`500 32px ${B}`;let cx=R;
  t.traits.forEach(s=>{const w=x.measureText(s).width+56;
    x.strokeStyle=acc;x.lineWidth=3;rrs(x,cx-w,y-36,w,60,30);
    x.textAlign='center';x.fillStyle=acc;x.fillText(s,cx-w/2,y+5);cx-=w+18});
  // two columns
  y+=95;const colW=(R-L-40)/2;
  const e1=section(x,'نقط قوتك',t.strong,R,y,colW,acc,B);
  const e2=section(x,'خد بالك من',t.watch,R-colW-40,y,colW,acc,B);
  // advice block
  y=Math.max(e1,e2)+10;rr(x,L,y,R-L,170,24,acc);
  x.textAlign='right';x.fillStyle='rgba(255,255,255,.85)';x.font=`500 28px ${B}`;x.fillText('نصيحتك',R-36,y+52);
  x.fillStyle='#fff';x.font=`bold 38px ${B}`;wrap(x,t.advice,R-36,y+108,R-L-72,50,'right');
  x.textAlign='center';x.fillStyle='#5E6964';x.font=`26px ${B}`;const endY=Math.max(1920,y+170+110);x.fillText('مرايتك · اختبار العناصر الأربعة',W/2,endY-40);
  const out=document.createElement('canvas');out.width=W;out.height=endY;out.getContext('2d').drawImage(c,0,0);
  const data=out.toDataURL('image/png');
  btn.disabled=false;btn.textContent='حمّل التقرير كصورة';
  const file='مرايتك-'+S.name.replace(/\s+/g,'-')+'.png';
  if(window.Android&&Android.saveImage){
    const ok=Android.saveImage(data.split(',')[1],file);
    toast(ok?'اتحفظ التقرير في الصور ✓':'معرفناش نحفظ الصورة، جرّب تاني');
    if(ok&&Android.shareImage)showBox(data,true);else showBox(data,false);
  }else{showBox(data,false);toast('اضغط مطولًا على الصورة واختار حفظ')}
}
function showBox(data,canShare){
  const b=$('reportBox');b.hidden=false;
  b.innerHTML=`<img src="${data}" alt="تقرير ${esc(S.name)}">`+(canShare?`<button class="btn alt" id="shareBtn" type="button">شارك التقرير</button>`:`<p class="hint">اضغط مطولًا على الصورة واختار "حفظ الصورة".</p>`);
  if(canShare)$('shareBtn').onclick=()=>Android.shareImage(data.split(',')[1]);
}
function section(x,title,items,right,y,w,acc,B){
  x.textAlign='right';x.fillStyle=acc;x.font=`bold 36px ${B}`;x.fillText(title,right,y);
  let yy=y+60;x.font=`30px ${B}`;
  items.forEach(s=>{x.fillStyle=acc;x.beginPath();x.arc(right-8,yy-10,6,0,Math.PI*2);x.fill();
    x.fillStyle='#E8EDE9';yy=wrap(x,s,right-28,yy,w-28,42,'right')+20});
  return yy;
}
function wrap(x,text,px,py,maxW,lh,align){
  x.textAlign=align;const words=text.split(' ');let line='',y=py;
  for(const w of words){const test=line?line+' '+w:w;
    if(x.measureText(test).width>maxW&&line){x.fillText(line,px,y);line=w;y+=lh}else line=test}
  x.fillText(line,px,y);return y+lh}
function fit(x,s,max){while(x.measureText(s).width>max&&s.length>1)s=s.slice(0,-1);return s}
function rp(x,a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else{r=Math.min(r,h/2,w/2);x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}}
function rr(x,a,b,w,h,r,f){rp(x,a,b,w,h,r);x.fillStyle=f;x.fill()}
function rrs(x,a,b,w,h,r){rp(x,a,b,w,h,r);x.stroke()}
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src})}

/* keep progress across live updates */
window.claude?.hot?.snapshot?.(()=>({name:S.name,i:S.i,answers:S.answers,orders:S.orders,screen:S.screen}));
function start(d){if(d&&d.name){Object.assign(S,d);nameIn.value=S.name;refreshStart();go(S.screen)}}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
