name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if uploaded as zip
        run: |
          if [ -f merayetak-android.zip ]; then unzip -o merayetak-android.zip -d proj; else mkdir -p proj && cp -r app build.gradle settings.gradle gradle.properties proj/; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk Merayetak.apk
          gh release create "v${{ github.run_number }}" Merayetak.apk --title "مرايتك ${{ github.run_number }}" --notes "نزّل Merayetak.apk وثبّته"
